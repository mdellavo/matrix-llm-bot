[package]
name = "matrix-llm-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
# rustls-tls (not the default native-tls) so this unifies with our own rustls-only
# reqwest 0.13 pin below instead of pulling in a second, openssl-based reqwest.
threatflux-anthropic-sdk = { version = "0.2.0", default-features = false, features = ["rustls-tls"] }
anyhow = "1.0.103"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
matrix-sdk = { version = "0.18.0", features = ["bundled-sqlite", "markdown"] }
# Matches a version already resolved transitively (via matrix-sdk-crypto's `ulid`
# dependency), so this adds no new distinct `rand` major version to the build.
rand = "0.10"
# rustls (not default-tls) so this reuses matrix-sdk's already-compiled TLS stack
# instead of pulling in a second (openssl-based) one.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Archived upstream (frozen, not broken) — our usage is a handful of flat string
# fields plus one string list for SKILL.md frontmatter, well within its stable core.
serde_yaml = "0.9.34"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
