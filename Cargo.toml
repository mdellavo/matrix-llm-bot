[package]
name = "matrix-llm-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anthropic-sdk-rust = "0.1.1"
anyhow = "1.0.103"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
matrix-sdk = { version = "0.18.0", features = ["bundled-sqlite", "markdown"] }
# Not used directly — anthropic-sdk-rust depends on reqwest 0.12 with its default
# (native-tls) features, a separate crate instance from our own rustls-only
# reqwest 0.13 pin below that Cargo can't unify across that version gap. That
# pulls in openssl-sys, which needs a system OpenSSL + pkg-config to build on
# Linux (silently satisfied by macOS's Security framework instead, which is why
# this doesn't show up locally). "vendored" makes openssl-sys build OpenSSL from
# source and link statically instead — Cargo's feature unification applies it to
# every use of openssl-sys in the tree, so this fixes anthropic-sdk-rust's copy
# too even though we don't depend on openssl directly.
openssl = { version = "0.10", features = ["vendored"] }
# Matches a version already resolved transitively (via matrix-sdk-crypto's `ulid`
# dependency), so this adds no new distinct `rand` major version to the build.
rand = "0.10"
# rustls (not default-tls) so this reuses matrix-sdk's already-compiled TLS stack
# instead of pulling in a second (openssl-based) one.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Archived upstream (frozen, not broken) — our usage is a handful of flat string
# fields plus one string list for SKILL.md frontmatter, well within its stable core.
serde_yaml = "0.9.34"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
